name: Build BikeOS Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy BikeOS web dashboard into Android assets
        run: |
          mkdir -p app/src/main/assets/css app/src/main/assets/js app/src/main/assets/assets
          cp index.html app/src/main/assets/index.html
          cp css/style.css app/src/main/assets/css/style.css
          cp js/app.js app/src/main/assets/js/app.js
          cp assets/icon.svg app/src/main/assets/assets/icon.svg
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BikeOS-JARVIS-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 "$APK" --clobber
          else
            gh release create v1.0.0 "$APK" --title "BikeOS JARVIS v1.0.0" --notes "Initial Android APK release for Samsung Galaxy A73. Debug-signed APK built from the BikeOS repository."
          fi
