name: Build BikeOS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'assets/**'
      - 'manifest.webmanifest'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sync canonical web application into Android assets
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/css app/src/main/assets/js app/src/main/assets/assets
          cp index.html app/src/main/assets/index.html
          cp css/style.css app/src/main/assets/css/style.css
          cp js/app.js app/src/main/assets/js/app.js
          cp manifest.webmanifest app/src/main/assets/manifest.webmanifest
          cp assets/icon.svg app/src/main/assets/assets/icon.svg

          cmp index.html app/src/main/assets/index.html
          cmp css/style.css app/src/main/assets/css/style.css
          cmp js/app.js app/src/main/assets/js/app.js
          cmp manifest.webmanifest app/src/main/assets/manifest.webmanifest
          cmp assets/icon.svg app/src/main/assets/assets/icon.svg

      - name: Validate diagnostic Android declarations
        run: |
          set -euo pipefail
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          ! grep -q 'YouTubeMediaListener' app/src/main/AndroidManifest.xml
          ! grep -q 'BIND_NOTIFICATION_LISTENER_SERVICE' app/src/main/AndroidManifest.xml

      - name: Build diagnostic debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload diagnostic APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BikeOS-JARVIS-diagnostic-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
